[Config QfiRulesByPort]
extends = Standalone
description = "Assign QFI 1/3 to unmarked UDP flows through separate UL and DL rules"
sim-time-limit = 300ms
**.vector-recording = false
*.numUe = 1

*.server.numApps = 4
*.ue[0].numApps = 4
*.server.app[0..1].typename = "UdpBasicApp"
*.ue[0].app[0..1].typename = "UdpBasicApp"
*.server.app[0..1].destAddresses = "ue[0]"
*.ue[0].app[0..1].destAddresses = "server"
*.server.app[0].destPort = 6200
*.server.app[1].destPort = 6204
*.ue[0].app[0].destPort = 6000
*.ue[0].app[1].destPort = 6004
*.server.app[0].packetName = "DL-control"
*.server.app[1].packetName = "DL-video"
*.ue[0].app[0].packetName = "UL-control"
*.ue[0].app[1].packetName = "UL-video"
**.app[0..1].dscp = 0
**.app[0..1].messageLength = 200B
**.app[0..1].sendInterval = 10ms
**.app[0..1].startTime = 50ms
**.app[0..1].stopTime = 180ms
*.server.app[2..3].typename = "UdpSink"
*.ue[0].app[2..3].typename = "UdpSink"
*.server.app[2].localPort = 6000
*.server.app[3].localPort = 6004
*.ue[0].app[2].localPort = 6200
*.ue[0].app[3].localPort = 6204

# Keep the official Standalone QFI-to-DRB table. Assign QFI by port in each direction.
*.bearerConfigurator.dlQfiRules = [
    {node: "upf", filter: "expr(has(udp) && udp.destPort == 6200)", qfi: 1},
    {node: "upf", filter: "expr(has(udp) && udp.destPort == 6204)", qfi: 3}
    ]
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(has(udp) && udp.destPort == 6000)", qfi: 1},
    {ue: "ue[0]", filter: "expr(has(udp) && udp.destPort == 6004)", qfi: 3}
    ]

# Last wired hop to the gNB, both directions. Inspect the outer IP header here.
*.iUpf.numPcapRecorders = 1
*.iUpf.pcapRecorder[0].moduleNamePatterns = "ppp[1]"
*.iUpf.pcapRecorder[0].dumpProtocols = "ipv4"
*.iUpf.pcapRecorder[0].fileFormat = "pcap"
*.iUpf.pcapRecorder[0].pcapFile = "${resultdir}/n3.pcap"
**.ip.checksumMode = "computed"
**.udp.checksumMode = "disabled"

[Config QfiRulesReverseUplink]
extends = QfiRulesByPort
description = "Swap the UL rules only, keeping packet headers and all DL rules fixed"
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(has(udp) && udp.destPort == 6000)", qfi: 3},
    {ue: "ue[0]", filter: "expr(has(udp) && udp.destPort == 6004)", qfi: 1}
    ]
