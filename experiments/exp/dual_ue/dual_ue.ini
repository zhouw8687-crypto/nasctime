include ../simu5g17_ladder_route.ini

[Config DualUe]
extends = LadderRouteFixed
sim-time-limit = 4s
description = "Same-gNB two-UE downlink with independent radio and transport bursts"
*.numUe = 2
*.ue[1].mobility.initialX = 120m
*.ue[1].mobility.initialY = 50m
*.ue[1].servingNodeId = 0
*.ue[1].nrServingNodeId = 1

*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, mappedQfis: [1], rlcMode: "UM", isDefault: true},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [3], rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[1]", drbId: 1, mappedQfis: [5], rlcMode: "UM", isDefault: true}
    ]

# Generate only after the potential transport bottleneck, at the serving gNB.
*.gnb1.numApps = 1
*.gnb1.app[0].typename = "nasctime.control.LocalQfiSource"
*.gnb1.app[0].destAddresses = "ue[1]"
*.gnb1.app[0].destPort = 6400
*.gnb1.app[0].packetName = "local-radio-competitor"
*.gnb1.app[0].messageLength = 1200B
*.gnb1.app[0].sendInterval = 400us
*.gnb1.app[0].startTime = 400ms
*.gnb1.app[0].stopTime = 900ms
*.ue[1].numApps = 1
*.ue[1].app[0].typename = "UdpSink"
*.ue[1].app[0].localPort = 6400

*.gnb1.cellularNic.mac.typename = "nasctime.control.ObservedNrMacGnb"
*.gnb1.cellularNic.mac.dlSchedulerType = "nasctime.control.ObservedDlScheduler"
*.gnb1.cellularNic.mac.schedulerDl.initialBandBudget = 4
*.gnb1.cellularNic.mac.schedulerDl.**.vector-recording = true

*.gnb1.app[0].packetSent:vector*.vector-recording = true
*.ue[1].app[0].packetReceived:vector*.vector-recording = true
*.ue[1].app[0].endToEndDelay:vector.vector-recording = true
*.ue[1].app[0].rcvdPkSeqNo:vector.vector-recording = true
*.NE1.app[0].packetSent:vector*.vector-recording = true
*.NE3.app[0].packetReceived:vector*.vector-recording = true
*.NE3.app[0].endToEndDelay:vector.vector-recording = true
*.NE3.app[0].rcvdPkSeqNo:vector.vector-recording = true
*.NE1.eth[*].queue.queue[*].queueLength:vector.vector-recording = true
*.NE1.eth[*].queue.queue[*].droppedPacketLengthsQueueOverflow:vector.vector-recording = true
