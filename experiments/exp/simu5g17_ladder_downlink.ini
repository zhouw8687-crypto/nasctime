include ../../nascTime/simulations/demos/e2e_ladder/routed-queues.ini

[Config LadderDownlinkUnmarked]
extends = RoutedPriority
network = nasctime.simulations.demos.e2e_ladder.Qfi17Ladder
description = "Control and video have distinct QFIs with unmarked N3 headers"
sim-time-limit = 300ms
*.NE*.eth[*].bitrate = 100Mbps
**.vector-recording = false
*.numUe = 1
*.gnb1.mobility.initialX = 100m
*.gnb1.mobility.initialY = 100m
*.gnb2.mobility.initialX = 500m
*.gnb2.mobility.initialY = 100m
*.ue[0].mobility.initialX = 120m
*.ue[0].mobility.initialY = 150m
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, mappedQfis: [1], rlcMode: "UM", isDefault: true},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [3], rlcMode: "UM"}
    ]
*.bearerConfigurator.dlQfiRules = [
    {node: "upf", filter: "expr(has(udp) && udp.destPort == 6200)", qfi: 1},
    {node: "upf", filter: "expr(has(udp) && udp.destPort == 6204)", qfi: 3}
    ]

*.server.numApps = 2
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[0]"
*.server.app[*].dscp = 0
*.server.app[*].messageLength = 200B
*.server.app[*].sendInterval = 10ms
*.server.app[*].startTime = 50ms
*.server.app[*].stopTime = 180ms
*.server.app[0].destPort = 6200
*.server.app[0].packetName = "DL-control"
*.server.app[1].destPort = 6204
*.server.app[1].packetName = "DL-video"
*.ue[0].numApps = 2
*.ue[0].app[*].typename = "UdpSink"
*.ue[0].app[0].localPort = 6200
*.ue[0].app[1].localPort = 6204

*.NE1.recordPcap = true
*.NE1.pcapRecorder[0].moduleNamePatterns = "eth[1]"
*.NE1.pcapRecorder[0].pcapFile = "${resultdir}/ne1-egress.pcap"
**.pcapRecorder[*].fileFormat = "pcap"
*.NE*.fcsMode = "computed"
**.ip.checksumMode = "computed"
**.udp.checksumMode = "disabled"

[Config LadderDownlinkMarked]
extends = LadderDownlinkUnmarked
description = "Mark N3 outer DSCP and classify the two flows into distinct queues"
*.upf.gtp_user.qfiDscpMap = [{qfi: 1, dscp: 46}, {qfi: 3, dscp: 34}]
