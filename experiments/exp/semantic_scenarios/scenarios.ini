include ../core_admission/core_admission.ini

[Config SemanticScenariosPF]
extends = AdmissionNormal
description = "PF scenario families for grouped counterfactual evaluation"
*.routeController.requireController = true
*.routeController.sampleInterval = 20ms

*.NE3.recordPcap = true
*.NE3.pcapRecorder[0].moduleNamePatterns = "eth[2]"
*.NE3.pcapRecorder[0].pcapFile = "${resultdir}/ne3-to-ne5.pcap"
*.NE2.recordPcap = true
*.NE2.pcapRecorder[0].moduleNamePatterns = "eth[1]"
*.NE2.pcapRecorder[0].pcapFile = "${resultdir}/ne2-to-ne4.pcap"
*.NE4.recordPcap = true
*.NE4.pcapRecorder[0].moduleNamePatterns = "eth[2]"
*.NE4.pcapRecorder[0].pcapFile = "${resultdir}/ne4-to-ne6.pcap"
