include ../dual_ue/dual_ue.ini

[Config CounterfactualPf]
extends = DualUe
description = "PF two-UE scenario with an external controller and six branch link measurement points"
*.gnb1.cellularNic.mac.schedulingDisciplineDl = "PF"
*.routeController.requireController = true
*.routeController.manageResources = true
*.upf.dnPpp.ingressTC.typename = "nasctime.control.FlowPolicer"
*.upf.dnPpp.ingressTC.packetFilter = expr(has(ipv4) && has(udp) && udp.destPort == 6204)
*.upf.dnPpp.ingressTC.flowId = "video"
*.upf.dnPpp.ingressTC.initialRate = 3Mbps

*.NE3.recordPcap = true
*.NE3.pcapRecorder[0].moduleNamePatterns = "eth[2]"
*.NE3.pcapRecorder[0].pcapFile = "${resultdir}/ne3-to-ne5.pcap"
*.NE2.recordPcap = true
*.NE2.pcapRecorder[0].moduleNamePatterns = "eth[1]"
*.NE2.pcapRecorder[0].pcapFile = "${resultdir}/ne2-to-ne4.pcap"
*.NE4.recordPcap = true
*.NE4.pcapRecorder[0].moduleNamePatterns = "eth[2]"
*.NE4.pcapRecorder[0].pcapFile = "${resultdir}/ne4-to-ne6.pcap"
