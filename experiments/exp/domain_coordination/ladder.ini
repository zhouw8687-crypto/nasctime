include ../simu5g17_ladder_route.ini

[Config DomainCoordinationNominal]
extends = LadderRouteJoint
description = "Same wired burst and resource actuators for both online policies"
*.upf.dnPpp.ingressTC.initialRate = 3Mbps

[Config DomainCoordinationShifted]
extends = DomainCoordinationNominal
description = "Repeat with the wired burst shifted by 200 ms"
*.NE1.app[0].startTime = 600ms
*.NE1.app[0].stopTime = 1100ms

[Config DomainCoordinationLowOffer]
extends = DomainCoordinationNominal
description = "Reduce offered video traffic while retaining the same 2 Mbit/s policy target"
*.server.app[1].sendInterval = 25ms

[Config DomainCoordinationLowOfferHighTarget]
extends = DomainCoordinationLowOffer
description = "Coordinating a high video target with low offered load and no in-window burst"
*.NE1.app[0].startTime = 1400ms
*.NE1.app[0].stopTime = 1450ms
