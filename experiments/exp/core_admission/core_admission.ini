include ../dual_ue/dual_ue.ini

[Config AdmissionReference]
extends = DualUe
*.gnb1.cellularNic.mac.schedulingDisciplineDl = "PF"
*.routeController.manageResources = true
*.upf.dnPpp.ingressTC.typename = "nasctime.control.FlowPolicer"
*.upf.dnPpp.ingressTC.flowId = "video"
*.upf.dnPpp.ingressTC.packetFilter = expr(has(ipv4) && has(udp) && udp.destPort == 6204)
*.upf.dnPpp.ingressTC.initialRate = 3Mbps
*.upf.dnPpp.ingressTC.initialCapacity = 3Mbps
*.upf.dnPpp.ingressTC.burstSize = 4120B
*.upf.dnPpp.ingressTC.recordAdmissionVectors = true
*.upf.dnPpp.ingressTC.admission*.vector-recording = true

[Config AdmissionNormal]
extends = AdmissionReference
*.gnb1.app[0].startTime = 5s
*.gnb1.app[0].stopTime = 6s
*.NE1.app[0].startTime = 5s
*.NE1.app[0].stopTime = 6s

[Config AdmissionRadio]
extends = AdmissionReference
*.NE1.app[0].startTime = 5s
*.NE1.app[0].stopTime = 6s

[Config AdmissionWired]
extends = AdmissionReference
*.gnb1.app[0].startTime = 5s
*.gnb1.app[0].stopTime = 6s

[Config AdmissionCore]
extends = AdmissionNormal
*.upf.dnPpp.ingressTC.capacitySchedule = [{atMs: 400, bps: 800000}, {atMs: 900, bps: 3000000}]

[Config AdmissionRadioCore]
extends = AdmissionRadio
*.upf.dnPpp.ingressTC.capacitySchedule = [{atMs: 400, bps: 800000}, {atMs: 900, bps: 3000000}]

[Config AdmissionWiredCore]
extends = AdmissionWired
*.upf.dnPpp.ingressTC.capacitySchedule = [{atMs: 400, bps: 800000}, {atMs: 900, bps: 3000000}]

[Config AdmissionAll]
extends = AdmissionReference
*.upf.dnPpp.ingressTC.capacitySchedule = [{atMs: 400, bps: 800000}, {atMs: 900, bps: 3000000}]

[Config AdmissionAllDetour]
extends = AdmissionAll
*.routeController.initialPath = "detour"

[Config AdmissionAllDetourBands]
extends = AdmissionAllDetour
*.gnb1.cellularNic.mac.schedulerDl.initialBandBudget = 10

[Config AdmissionStaggered]
extends = AdmissionAll
*.upf.dnPpp.ingressTC.capacitySchedule = [{atMs: 550, bps: 800000}, {atMs: 800, bps: 3000000}]

[Config AdmissionLowOffer]
extends = AdmissionCore
*.server.app[1].sendInterval = 20ms

[Config AdmissionPolicyLimited]
extends = AdmissionNormal
*.upf.dnPpp.ingressTC.initialRate = 800kbps