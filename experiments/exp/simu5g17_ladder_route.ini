include simu5g17_ladder_downlink.ini

[Config LadderRouteFixed]
extends = LadderDownlinkMarked
network = nasctime.simulations.demos.e2e_ladder.Qfi17ControlledLadder
description = "Fixed N3 shortest path under a burst on NE1-NE3"
sim-time-limit = 1500ms
*.routeController.traceFile = "${resultdir}/routes.jsonl"
*.configurator.config = xmldoc("../../nascTime/simulations/demos/e2e_ladder/native-reuse.xml", "/reuse/config[@id='detour']")

*.carrierAggregation.componentCarrier[0].numBands = 24
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1
*.NE{1,3}.eth[1].bitrate = 10Mbps
*.NE{1,3}.eth[1].queue.bitrate = 10Mbps

*.server.app[*].startTime = 100ms
*.server.app[*].stopTime = 1300ms
*.server.app[0].sendInterval = 5ms
*.server.app[1].sendInterval = 4ms
*.server.app[1].messageLength = 1000B

# An independent wired flow keeps competing on the left branch during rerouting.
*.NE{1,3}.hasUdp = true
*.NE1.numApps = 1
*.NE1.app[0].typename = "UdpBasicApp"
*.NE1.app[0].destAddresses = "NE3%eth1"
*.NE1.app[0].destPort = 6300
*.NE1.app[0].packetName = "left-background"
*.NE1.app[0].dscp = 34
*.NE1.app[0].messageLength = 1000B
*.NE1.app[0].sendInterval = 500us
*.NE1.app[0].startTime = 400ms
*.NE1.app[0].stopTime = 900ms
*.NE3.numApps = 1
*.NE3.app[0].typename = "UdpSink"
*.NE3.app[0].localPort = 6300

*.NE1.numPcapRecorders = 2
*.NE1.pcapRecorder[1].moduleNamePatterns = "eth[0]"
*.NE1.pcapRecorder[1].pcapFile = "${resultdir}/ne1-detour.pcap"
*.NE6.recordPcap = true
*.NE6.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.NE6.pcapRecorder[0].pcapFile = "${resultdir}/ne6-to-ne5.pcap"

*.server.app[*].packetSent:vector*.vector-recording = true
*.ue[0].app[*].packetReceived:vector*.vector-recording = true
*.ue[0].app[*].endToEndDelay:vector.vector-recording = true
*.ue[0].app[*].rcvdPkSeqNo:vector.vector-recording = true

[Config LadderRouteFixedFifo]
extends = LadderRouteFixed
description = "Fixed N3 shortest path with a single shared queue"
*.NE1.eth[1].queue.numTrafficClasses = 1
*.NE1.eth[1].queue.classifier.mapping = [[0],[0],[0],[0],[0],[0],[0],[0]]

[Config LadderRouteAdaptive]
extends = LadderRouteFixed
description = "External controller can switch NE1 between two installed N3 paths"
*.routeController.requireController = true

[Config LadderRouteAdaptiveShifted]
extends = LadderRouteAdaptive
description = "Run the same controller after shifting the wired burst by 200 ms"
*.NE1.app[0].startTime = 600ms
*.NE1.app[0].stopTime = 1100ms

[Config LadderRouteResources]
extends = LadderRouteFixed
description = "Fixed path, gNB band budget, and UPF video rate"
*.routeController.manageResources = true
*.gnb1.cellularNic.mac.typename = "nasctime.control.RouteNrMacGnb"
*.gnb1.cellularNic.mac.dlSchedulerType = "nasctime.control.ControlledDlScheduler"
*.gnb1.cellularNic.mac.schedulerDl.initialBandBudget = 4
*.gnb1.cellularNic.mac.schedulerDl.controlledDlAllocatedBlocks.vector-recording = true
*.upf.dnPpp.ingressTC.typename = "nasctime.control.FlowPolicer"
*.upf.dnPpp.ingressTC.flowId = "video"
*.upf.dnPpp.ingressTC.packetFilter = expr(has(ipv4) && has(udp) && udp.destPort == 6204)
*.upf.dnPpp.ingressTC.initialRate = 1Mbps

[Config LadderRouteGrid]
extends = LadderRouteResources
description = "Enumerate two paths, radio budgets and video rate caps"
*.routeController.initialPath = "${path=direct,detour}"
*.gnb1.cellularNic.mac.schedulerDl.initialBandBudget = ${bands=4,10}
*.upf.dnPpp.ingressTC.initialRate = ${rate=1,3}Mbps
seed-set = 0

[Config LadderRouteJoint]
extends = LadderRouteResources
description = "Apply a combined N3 path, gNB band budget and UPF video rate"
*.routeController.requireController = true

[Config LadderRouteJointShifted]
extends = LadderRouteJoint
description = "Exercise the same joint policy on a shifted burst"
*.NE1.app[0].startTime = 600ms
*.NE1.app[0].stopTime = 1100ms

[Config LadderRouteIndependent]
extends = LadderRouteResources
description = "Route reacts to queues and the other domains keep separate fixed budgets"
*.routeController.requireController = true
*.gnb1.cellularNic.mac.schedulerDl.initialBandBudget = 10
*.upf.dnPpp.ingressTC.initialRate = 3Mbps

[Config LadderRouteCalibrated]
extends = LadderRouteJoint
description = "Select joint resource actions from the measured phase candidates"

[Config LadderRouteCalibratedShifted]
extends = LadderRouteCalibrated
description = "Reuse nominal phase candidates on a shifted burst without recalibration"
*.NE1.app[0].startTime = 600ms
*.NE1.app[0].stopTime = 1100ms
