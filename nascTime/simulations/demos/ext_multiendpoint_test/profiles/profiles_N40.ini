*.tsnDeviceB[36].app[1].destPort = 7000
*.tsnDeviceB[36].app[1].localPort = 7000
*.tsnDeviceB[36].app[1].messageLength = 100B
*.tsnDeviceB[36].app[1].sendInterval = 10ms
*.tsnDeviceB[36].app[1].startTime = 1s

