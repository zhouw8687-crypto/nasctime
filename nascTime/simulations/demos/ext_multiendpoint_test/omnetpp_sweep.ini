#
# omnetpp_sweep.ini — MSWiM 2026 primary matrix
#
# OMNeT++ does not expand iteration variables inside `include` directives,
# so we use one explicit Config per N value, each with a static include of
# its profile fragment. The scheduler stays as an iteration variable.
#
# Resulting cells:
#   Primary: 5 Configs (N1..N20) x 5 schedulers x 3 reps = 75 runs
#   Fading:  3 Configs (N1, N10, N20) x 2 sched x 2 fade x 3 reps = 36 runs
#   Gptp:    3 Configs x 5 sched x 3 reps = 45 runs
#

include ex_multi_omnetpp.ini

# ============================================================================
# Common settings inherited by all sweep configs
# ============================================================================
[Config SweepBase]
sim-time-limit = 30s
warmup-period = 2s
 
# Scheduler iteration (quotes required: schedulingDisciplineDl is a string param)
*.gnb.cellularNic.mac.schedulingDisciplineDl = ${sched="MAXCI","PF","DRR","MAXCI_COMP","QOS_PF"}
*.gnb.cellularNic.mac.schedulingDisciplineUl = ${sched}
 
# 3 reps per cell
repeat = 3
seed-set = ${repetition}
 
# Vector recording: only delay + residence time
**.vector-recording = true
**.scalar-recording = true
#*.tsnDeviceB[*].app[*].endToEndDelay.statistic-recording = true
#*.tsnDeviceB[*].app[*].endToEndDelay.vector-recording = true
#*.tsnDeviceA.app[*].endToEndDelay.statistic-recording = true
#*.tsnDeviceA.app[*].endToEndDelay.vector-recording = true
#*.dsTt[*].translator.residenceTime.statistic-recording = true
#*.dsTt[*].translator.residenceTime.vector-recording = true
 
# ============================================================================
# Primary matrix: per-N Configs
# ============================================================================
[Config Sweep_N1]
extends = SweepBase
description = "N=1 scheduler sweep"
include profiles/profiles_N1.ini
result-dir = results/sweep_primary
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
 
[Config Sweep_N5]
