result-dir = results/sweep_fading
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
 
# ============================================================================
# gPTP sweep: 3 N x 5 sched x 3 reps = 45 runs
# Reuses primary scheduler list; separate result dir
# ============================================================================
[Config Gptp_N1]
extends = SweepBase
include profiles/profiles_N1.ini
result-dir = results/sweep_gptp
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
 
