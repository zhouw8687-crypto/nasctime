# ============================================================================
# Fading sensitivity: 3 N x 2 sched x 2 fade x 3 reps = 36 runs
# Override scheduler list to MAXCI vs QOS_PF only
# ============================================================================
[Config FadeBase]
sim-time-limit = 30s
warmup-period = 2s
 
# Scheduler iteration (quotes required: schedulingDisciplineDl is a string param)
*.gnb.cellularNic.mac.schedulingDisciplineDl = ${sched="MAXCI","QOS_PF"}
*.gnb.cellularNic.mac.schedulingDisciplineUl = ${sched}
 
# 3 reps per cell
repeat = 3
seed-set = ${repetition}
 
# Vector recording: only delay + residence time
**.vector-recording = true
**.scalar-recording = true
*.gnb.cellularNic.channelModel[0].fading = ${fading=false,true}
 
[Config Fade_N1]
extends = FadeBase
include profiles/profiles_N1.ini
result-dir = results/sweep_fading
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec
 
[Config Fade_N10]
