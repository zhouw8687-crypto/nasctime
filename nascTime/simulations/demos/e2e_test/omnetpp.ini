#
# e2e_test —— 按项目书搭的端到端环境
#
# 两条业务流，分别验证两种接入：
#   ue[0] → server（无线接入，走 GTP：UE ⇢ gNB → n3Router → n3Edge → PE链 → coreRouter → UPF → server）
#   host  → server（有线接入，纯 IP：host → edge → PE链 → coreRouter → server）
#
# 两个配置：
#   NoClassify —— 不打 PCP 标记（基线）：所有流量都进 class0，只会拿到很少的窗口
#   Classified —— 做流分类：GTP-U(2152) → PCP 4（高优先），有线流 → PCP 0
#
[General]
network = nasctime.simulations.demos.e2e_test.ProjectBookNetwork
sim-time-limit = 3s

*.*.eth[*].bitrate = 100Mbps

############### 无线接入 ###############
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 200m
*.ue[0].mobility.initialY = 200m
*.gnb.mobility.initialX = 150m
*.gnb.mobility.initialY = 150m

*.ue[0].numApps = 1
*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 6000
*.ue[0].app[0].localPort = 6001
*.ue[0].app[0].messageLength = 200B
*.ue[0].app[0].sendInterval = 10ms
*.ue[0].app[0].startTime = uniform(0s, 0.05s)

############### 有线接入 ###############
*.host.numApps = 1
*.host.app[0].typename = "UdpBasicApp"
*.host.app[0].destAddresses = "server"
*.host.app[0].destPort = 6100
*.host.app[0].localPort = 6101
*.host.app[0].messageLength = 200B
*.host.app[0].sendInterval = 10ms
*.host.app[0].startTime = uniform(0s, 0.02s)

############### 数据网 ###############
*.server.numApps = 2
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 6000
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 6100

############### 承载：Qbv 门控 ###############
# 两个流量等级。窗口比例取"合理值"（不是 20µs 那种极端配置）：
#   class1（高优先）每 1 ms 拿 200 µs
#   class0（尽力而为）拿剩下的 800 µs
*.pe*.hasEgressTrafficShaping = true
*.pe*.eth[*].macLayer.queue.numTrafficClasses = 2
*.pe*.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.pe*.eth[*].macLayer.queue.transmissionGate[0].durations = [800us, 200us]
*.pe*.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.pe*.eth[*].macLayer.queue.transmissionGate[1].durations = [800us, 200us]

# 最后一个 PE 出口剥掉 802.1Q C-Tag（核心侧是普通 IP 设备）
*.pe3.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]


#
# 基线：不做流分类
#
[Config NoClassify]
description = "不打 PCP 标记，全部流量落进 class0"


#
# 做流分类：GTP-U → 高优先
#
[Config Classified]
description = "N3 边缘按 GTP-U(2152) 标 PCP 4；有线流保持 PCP 0"

# N3 边缘分类交换机：识别 GTP-U 并打标
*.n3Edge.hasOutgoingStreams = true
*.n3Edge.bridging.interfaceRelay.learner.typename = ""
*.n3Edge.bridging.streamIdentifier.identifier.mapping = [
    {stream: "gtp", packetFilter: expr(udp.destPort == 2152)}]
*.n3Edge.bridging.streamCoder.encoder.mapping = [
    {stream: "gtp", pcp: 4}]

# 有线终端暂不做流编码（先隔离 ARP 问题）
