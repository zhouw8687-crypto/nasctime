#
# pe_test —— PE 承载域：TSN 门控开/关对照
#
# 验证项目书条款："TSN 机制为确定性流量预留固定传输窗口的保障能力"
#
# 两条流：
#   client1 → BE（1442B 载荷，~60 Mbps）
#   client2 → HP（14B 载荷，1 ms 周期）
# 用 UdpBasicApp + UdpSink（INET 自带 endToEndDelay 统计），不用 UdpSinkApp
# （后者默认 packetFilter 会把流全丢，见 README 记录）。
#
[General]
network = nasctime.simulations.demos.pe_test.PeNetwork
sim-time-limit = 1s

*.*.eth[*].bitrate = 100Mbps

############### 业务源 ###############
*.client*.numApps = 1
*.client*.app[0].typename = "UdpBasicApp"
*.client*.app[0].destAddresses = "server"
*.client*.app[0].startTime = uniform(0s, 0.001s)

*.client1.app[0].destPort = 1000
*.client1.app[0].localPort = 1100
*.client1.app[0].messageLength = 1442B
*.client1.app[0].sendInterval = exponential(200us)

*.client2.app[0].destPort = 1001
*.client2.app[0].localPort = 1101
*.client2.app[0].messageLength = 14B
*.client2.app[0].sendInterval = 1ms

############### 接收端 ###############
*.server.numApps = 2
*.server.app[*].typename = "UdpSink"
*.server.app[0].localPort = 1000
*.server.app[1].localPort = 1001


#
# 不门控
#
[Config NoGating]
description = "无门控：BE 大包会阻塞 HP 小包，HP 时延抖动大"


#
# 门控（照 INET showcases/tsn/trafficshaping/timeawareshaper 的写法）
#
[Config Gating]
description = "TSN 门控：每 1 ms 周期给 HP 20 µs 独占窗口"

*.client*.hasOutgoingStreams = true
*.client*.bridging.streamIdentifier.identifier.mapping = [
    {stream: "best-effort",   packetFilter: expr(udp.destPort == 1000)},
    {stream: "high-priority", packetFilter: expr(udp.destPort == 1001)}]
*.client*.bridging.streamCoder.encoder.mapping = [
    {stream: "best-effort",   pcp: 0},
    {stream: "high-priority", pcp: 4}]

# PE 转发时不保留 802.1Q C-Tag（否则接收端不认识带标签的帧）
*.pe*.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# PE 出口门控
*.pe*.hasEgressTrafficShaping = true
*.pe*.eth[*].macLayer.queue.numTrafficClasses = 2
*.pe*.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.pe*.eth[*].macLayer.queue.transmissionGate[0].durations = [20us, 980us]
*.pe*.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.pe*.eth[*].macLayer.queue.transmissionGate[1].durations = [20us, 980us]
