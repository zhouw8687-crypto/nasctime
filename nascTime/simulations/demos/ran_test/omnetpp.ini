#
# ran_test —— 无线接入域（NR）
#
# 设计原则：本域**不复制任何 NED**，直接引用 Simu5G 官方的网络定义
#   simu5g.simulations.nr.networks.SingleCell_Standalone
# 这样 Simu5G 升级时本域自动跟随，且与 ring_test / mpls_test 完全解耦。
#
# 结构（来自 SingleCell_Standalone.ned）：
#   server ── router ── upf ── iUpf ── gnb ──NR── ue[*]
#
# 与其它域的边界：
#   无线接入域的下行边界是 `iUpf` 的 N3 口；要接 L3 承载域时，把 server/router
#   换成 mpls 域的 LSR 即可（尚未做）。
#
[General]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit = 3s

############### gNodeB ###############
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############### UE ###############
*.numUe = 1
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

############### 业务：server → ue[0] 下行 UDP ###############
*.server.numApps = 1
*.server.app[0].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3001
*.server.app[0].messageLength = 200B
*.server.app[0].sendInterval = 10ms
*.server.app[0].startTime = uniform(0s, 0.02s)

*.ue[0].numApps = 1
*.ue[0].app[0].typename = "UdpSink"
*.ue[0].app[0].localPort = 3000
