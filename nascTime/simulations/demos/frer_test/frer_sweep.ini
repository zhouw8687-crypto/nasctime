#
# frer_sweep.ini — IEEE 802.1CB FRER evaluation sweep
#
# Evaluates FRER benefit across scheduler × N × FRER-mode combinations.
#
# FRER modes:
#   Baseline  — FRER disabled (4 DRBs, control comparison)
#   Asymmetric — DRB 4 non-GBR, priority 2 (default FRER mode)
#   Symmetric  — DRB 4 GBR, priority 1 (same tier as CLC primary)
#
# Bandwidth:
#   10 MHz (numBands=24) for N=15, N=20
#   20 MHz (numBands=51) for N=30, N=40
#
#   FIX: every numBands assignment below is now EXPLICIT per config, rather
#   than relying on inheritance from ex_multi_omnetpp.ini's default. As
#   originally written, FrerAsym_* was hardcoded to numBands=106 (40 MHz)
#   for all four N values regardless of the plan above, and FrerSym_N15/N20
#   and FrerBaseline_N15/N20 had no override at all and silently inherited
#   the base file's 40 MHz default. Net effect: 8 of 12 configs were running
#   at the wrong bandwidth, only Sym/Baseline N30/N40 matched the stated
#   plan. Confirmed by tracing each Config's numBands against the base file.
#
# Prerequisites:
#   Generate FRER profile fragments before running:
#     python3 gen_profile_ini.py --all --frer -o profiles/
#     python3 gen_profile_ini.py --all --frer --frer-symmetric -o profiles/
#     python3 gen_profile_ini.py --all -o profiles/       (baseline, if not done)
#

include ../ext_multiendpoint_test/ex_multi_omnetpp.ini

# ============================================================================
# Common base for all FRER sweep runs
# ============================================================================
[Config FrerSweepBase]
sim-time-limit = 10s
warmup-period = 2s

# 4 schedulers (excluding MAXCI_COMP for FRER evaluation)
*.gnb.cellularNic.mac.schedulingDisciplineDl = ${sched="MAXCI","PF","DRR","QOS_PF"}
*.gnb.cellularNic.mac.schedulingDisciplineUl = ${sched}

# 5 repetitions per cell
repeat = 5
seed-set = ${repetition}

# Recording
**.vector-recording = true
**.scalar-recording = true

# ============================================================================
# FRER-enabled base: activates replication + recovery modules
# ============================================================================
[Config FrerEnabledBase]
extends = FrerSweepBase

# NW-TT replication
*.nwTt.frerEnabled = true
*.nwTt.frerReplicator.frerStreams = "7"
*.nwTt.frerReplicator.replicaDscp = 8
*.nwTt.frerReplicator.transportBinding = "drb"

# DS-TT recovery
*.dsTt[*].frerEnabled = true
*.dsTt[*].frerRecovery.frerStreams = "7"
*.dsTt[*].frerRecovery.replicaDscp = 8
*.dsTt[*].frerRecovery.windowSize = 64
*.dsTt[*].frerRecovery.windowTimeout = 0.1s

# ============================================================================
# ASYMMETRIC FRER: DRB 4 = non-GBR, priority 2 (lower than CLC primary)
# Profile fragments generated by: gen_profile_ini.py --all --frer
# ============================================================================
[Config FrerAsym_N15]
extends = FrerEnabledBase
description = "N=15, FRER asymmetric, 10 MHz"
include profiles/profiles_N15_frer_asym.ini
*.carrierAggregation.componentCarrier[0].numBands = 24
result-dir = results/sweep_frer
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec

