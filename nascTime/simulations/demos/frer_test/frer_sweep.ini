# ============================================================================
# gPTP FRER: replicate gPTP frames alongside CLC
#
# NOTE: This only works when gptpTransportMode = "gtpu" (gPTP frames
# traverse ipForwardOut and are visible to FrerReplicator).  In sideband
# mode, gPTP frames bypass ipForwardOut via the gptpOut gate and are
# never replicated.
#
# FIX: gptpTransportMode was never actually set anywhere in this sweep or
# in ex_multi_omnetpp.ini -- relying on whatever NwTtTranslator's NED
# default is. Every other ini file that cared about this (bridge_test,
# gptp_test, qos_test) set it explicitly to "gtpu" rather than trusting
# the default, and this file's own comment says gtpu mode is required for
# gPTP replication to work at all -- so leaving it unset here risked a
# silent no-op (clean run, zero gPTP frames actually replicated) exactly
# like the SDAP/DRB gaps found earlier. Made explicit below.
#
# The gPTP DSCP value must match whatever the NW-TT assigns to gPTP-in-UDP
# traffic.  REVIEW: verify the gPTP DSCP in your NwTtTranslator code and
# update frerStreams accordingly.
# ============================================================================
[Config FrerGptp_N15]
extends = FrerEnabledBase
description = "N=15, FRER on CLC + gPTP, 10 MHz"
include profiles/profiles_N15_frer_asym.ini
*.nwTt.translator.gptpTransportMode = "gtpu"
*.carrierAggregation.componentCarrier[0].numBands = 24
# Add gPTP DSCP (5) to the FRER stream filter
*.nwTt.frerReplicator.frerStreams = "7,5"
*.dsTt[*].frerRecovery.frerStreams = "7,5"
result-dir = results/sweep_frer
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec

