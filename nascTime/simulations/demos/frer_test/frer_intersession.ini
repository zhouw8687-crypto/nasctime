#
# frer_intersession.ini — Inter-PDU-session FRER validation config
#
# Prerequisites:
#   1. gNodeBDrb must support a second PPP gate (pppg[] or ppp2)
#   2. IP configurator must assign addresses for the upf2 ↔ gnb link
#   3. gen_profile_ini.py --frer must generate 5-DRB profiles
#
# Topology when frerInterSession=true:
#   nwTt.pppIf  → upf  → gnb (primary, DSCP=7)
#   nwTt.pppIf2 → upf2 → gnb (replica, DSCP=34)
#

include ../ext_multiendpoint_test/ex_multi_omnetpp.ini

[Config FrerInterSession_N15]
description = "N=15, inter-PDU-session FRER, 10 MHz"
sim-time-limit = 10s
warmup-period = 0.5s

*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

repeat = 1
seed-set = 0

**.vector-recording = true
**.scalar-recording = true

include profiles/profiles_N1_frer_asym.ini

# --- Enable FRER framework ---
*.nwTt.frerEnabled = true
*.dsTt[*].frerEnabled = true

# --- Enable inter-session topology ---
*.frerInterSession = true
*.nwTt.frerInterSession = true
*.upf2.gtp_user.forceTunnelPeer = "gnb"    # same gNB, not gnb2

# --- Configure FrerReplicator for inter-session ---
*.nwTt.frerReplicator.transportBinding = "pduSession"
*.nwTt.frerReplicator.frerStreams = "7"
*.nwTt.frerReplicator.replicaDscp = 8
*.nwTt.frerReplicator.replicaInterface = "pppIf2"

# --- FrerRecovery (unchanged from DRB config) ---
*.dsTt[*].frerRecovery.frerStreams = "7"
*.dsTt[*].frerRecovery.replicaDscp = 8
*.dsTt[*].frerRecovery.windowSize = 64
*.dsTt[*].frerRecovery.windowTimeout = 0.1s

# --- UPF2 gateway configuration ---
# REVIEW: adjust gateway parameter to match your UPF naming
*.upf2.nodeType = "UPF"

result-dir = results/validate_frer_intersession
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec

# --- gNB second PPP interface ---
*.gnb.frerInterSession = true