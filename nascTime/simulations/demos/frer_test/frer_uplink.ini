#
# frer_uplink.ini — Bidirectional FRER validation
#
# DL: NW-TT replicates → DS-TT recovers (existing)
# UL: DS-TT replicates → NW-TT recovers (new)
#

include ../ext_multiendpoint_test/ex_multi_omnetpp.ini

[Config FrerBidirectional_N1]
description = "N=1, bidirectional FRER (DL + UL), DRB binding"
sim-time-limit = 10s
warmup-period = 0.5s

*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

repeat = 1
seed-set = 0
**.vector-recording = true
**.scalar-recording = true

include profiles/profiles_N1_frer_asym.ini

# --- DL FRER (existing) ---
*.nwTt.frerEnabled = true
*.nwTt.frerReplicator.frerStreams = "7"
*.nwTt.frerReplicator.replicaDscp = 8
*.nwTt.frerReplicator.transportBinding = "drb"

*.dsTt[*].frerEnabled = true
*.dsTt[*].frerRecovery.frerStreams = "7"
*.dsTt[*].frerRecovery.replicaDscp = 8

# --- UL FRER (new) ---
*.dsTt[*].frerUplinkEnabled = true
*.dsTt[*].frerReplicatorUl.frerStreams = "7"
*.dsTt[*].frerReplicatorUl.replicaDscp = 8
*.dsTt[*].frerReplicatorUl.transportBinding = "drb"
*.dsTt[*].frerReplicatorUl.ethernetFramed = true

*.nwTt.frerUplinkEnabled = true
*.nwTt.frerRecoveryUl.frerStreams = "7"
*.nwTt.frerRecoveryUl.replicaDscp = 8
*.nwTt.frerRecoveryUl.ethernetFramed = true

result-dir = results/validate_frer_uplink
output-scalar-file = ${resultdir}/${configname}_run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}_run${runnumber}.vec