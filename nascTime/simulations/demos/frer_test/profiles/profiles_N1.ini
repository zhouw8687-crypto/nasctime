# ============================================================
# Auto-generated by gen_profile_ini.py
# numEndpoints = 1
# profiles = CLC
# Counts: CLC=1
# ============================================================

*.numEndpoints = 1
*.endpointProfiles = "CLC"

# ----- NW-TT multi-endpoint registration -----
*.nwTt.translator.tsnDeviceBAddresses = [ \
    {address: "tsnDeviceB[0]", ue: "ue[0]"}]

# ----- SDAP / DRB config (4 DRBs: BE/MV-HP/CLC/gPTP) -----
*.gnb.cellularNic.numDrbs = 4
*.ue[*].cellularNic.numDrbs = 4

*.gnb.cellularNic.sdap.drbConfig = [ \
    {drb: 0, ue: 2049, qfiList: [0]}, \
    {drb: 1, ue: 2049, qfiList: [6]}, \
    {drb: 2, ue: 2049, qfiList: [7]}, \
    {drb: 3, ue: 2049, qfiList: [5]}]

*.ue[*].cellularNic.sdap.drbConfig = [ \
    {drb: 0, qfiList: [0]}, \
    {drb: 1, qfiList: [6]}, \
    {drb: 2, qfiList: [7]}, \
    {drb: 3, qfiList: [5]}]

# ----- drbQosConfig (1 UEs x 4 DRBs = 4 entries) -----
*.gnb.cellularNic.mac.drbQosConfig = [ \
    {"drb": 0, "ue": 2049, "gbr": false, "delayBudget": 50, "per": 1e-2, "priority": 3}, \
    {"drb": 1, "ue": 2049, "gbr": true, "delayBudget": 10, "per": 1e-3, "priority": 2}, \
    {"drb": 2, "ue": 2049, "gbr": true, "delayBudget": 2, "per": 1e-4, "priority": 1}, \
    {"drb": 3, "ue": 2049, "gbr": true, "delayBudget": 1, "per": 1e-5, "priority": 0}]

# ----- TSN Device A: traffic generators -----
*.tsnDeviceA.hasOutgoingStreams = true
*.tsnDeviceA.numApps = 2

# app[0]: endpoint 0 (CLC) flow 'clc_hp'
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceB[0]"
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].messageLength = 100B
*.tsnDeviceA.app[0].sendInterval = 1ms
*.tsnDeviceA.app[0].startTime = uniform(0s, 0.01s)

# app[1]: reverse traffic sink
*.tsnDeviceA.app[1].typename = "UdpSink"
*.tsnDeviceA.app[1].localPort = 7000

# ----- TSN Device A: stream identification + VLAN encoding -----
*.tsnDeviceA.bridging.streamIdentifier.identifier.mapping = [ \
    {packetFilter: expr(has(udp) && udp.destPort == 5000), stream: "ep0_clc_hp"}]

*.tsnDeviceA.bridging.streamCoder.encoder.mapping = [ \
    {stream: "ep0_clc_hp", vlan: 100, pcp: 7}]

# ----- TSN Device B: per-endpoint sinks + reverse source -----
# Device B[0] (CLC): 1 sink(s) + 1 reverse source
*.tsnDeviceB[0].numApps = 2
*.tsnDeviceB[0].app[0].typename = "UdpSink"
*.tsnDeviceB[0].app[0].localPort = 5000
*.tsnDeviceB[0].app[1].typename = "UdpBasicApp"
*.tsnDeviceB[0].app[1].destAddresses = "tsnDeviceA"
*.tsnDeviceB[0].app[1].destPort = 7000
*.tsnDeviceB[0].app[1].localPort = 7000
*.tsnDeviceB[0].app[1].messageLength = 100B
*.tsnDeviceB[0].app[1].sendInterval = 10ms
*.tsnDeviceB[0].app[1].startTime = 1s

# ----- Static BMCA spanning tree (auto-generated for N=1) -----
*.staticBmca.spanningTree = [ \
    {node: "tsnDeviceA", role: "MASTER", masterPorts: ["eth0"], slavePort: ""}, \
    {node: "tsnSwitch", role: "BRIDGE", masterPorts: ["eth1"], slavePort: "eth0"}, \
    {node: "tsnDeviceB[0]", role: "SLAVE", masterPorts: [], slavePort: "eth0"}]

