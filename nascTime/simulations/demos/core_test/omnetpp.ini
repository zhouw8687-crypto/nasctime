#
# core_test —— 核心网域最小单元
#
# 业务：hostA → server 单向 UDP（代表接入侧送进核心网的流）
# 验证：能否穿过 I-UPF → UPF 到达数据网；端到端时延多少。
#
[General]
network = nasctime.simulations.demos.core_test.CoreNetwork
sim-time-limit = 3s

*.hostA.numApps = 1
*.hostA.app[0].typename = "UdpBasicApp"
*.hostA.app[0].destAddresses = "server"
*.hostA.app[0].destPort = 4000
*.hostA.app[0].localPort = 4001
*.hostA.app[0].messageLength = 200B
*.hostA.app[0].sendInterval = 10ms
*.hostA.app[0].startTime = uniform(0s, 0.02s)

*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 4000
