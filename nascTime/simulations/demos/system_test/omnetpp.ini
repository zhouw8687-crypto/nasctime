#
# system_test —— 整体组装模型（承载为中心 + 多接入）
#
# 业务：TSN 接入侧 src →（L2 三角环）→ 边界路由器 →（L3 承载环）→ 核心 server
# 本版目标：先把整条链路跑通；FRER、门控、gNB 接入属后续增量。
#
[General]
network = nasctime.simulations.demos.system_test.SystemTest
sim-time-limit = 3s

*.src.numApps = 1
*.src.app[0].typename = "UdpBasicApp"
*.src.app[0].destAddresses = "server"
*.src.app[0].destPort = 5000
*.src.app[0].localPort = 5001
*.src.app[0].messageLength = 200B
*.src.app[0].sendInterval = 10ms
*.src.app[0].startTime = uniform(0s, 0.02s)

*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# 接口速率兜底
*.*.eth[*].bitrate = 10Gbps
*.*.ppp[*].bitrate = 10Gbps
