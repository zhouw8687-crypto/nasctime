#
# system_test —— 无线接入版（system_test 的增量变体）
#
# 业务：ue[0] → server（上行，走 GTP：UE → gNB → 承载环 → UPF → server）
# 有线侧同时保留 src → server 的链，验证两种接入共存。
#
[General]
network = nasctime.simulations.demos.system_test.SystemTestWireless
sim-time-limit = 3s

############### 无线侧 ###############
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 1100m
*.ue[0].mobility.initialY = 200m
*.gnb.mobility.initialX = 1100m
*.gnb.mobility.initialY = 150m

############### 无线侧业务：UE → server（上行）###############
*.ue[0].numApps = 1
*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 5000
*.ue[0].app[0].localPort = 5002
*.ue[0].app[0].messageLength = 200B
*.ue[0].app[0].sendInterval = 10ms
*.ue[0].app[0].startTime = uniform(0s, 0.05s)

############### 有线接入侧 ###############
*.src.numApps = 1
*.src.app[0].typename = "UdpBasicApp"
*.src.app[0].destAddresses = "server"
*.src.app[0].destPort = 5000
*.src.app[0].localPort = 5001
*.src.app[0].messageLength = 200B
*.src.app[0].sendInterval = 10ms
*.src.app[0].startTime = uniform(0s, 0.02s)

############### 数据网 ###############
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

############### 接口速率 ###############
*.*.eth[*].bitrate = 10Gbps
*.*.ppp[*].bitrate = 10Gbps
