include omnetpp_controller.ini

[Config CrossDomainTransport]
extends = ControllerBaseline
*.controller.transportShaperModule = "NE1.eth[1].queue"
*.NE1.eth[1].queue.transmissionGate[2].initiallyOpen = true
*.NE1.eth[1].queue.transmissionGate[0..1].initiallyOpen = false
*.NE1.eth[1].queue.transmissionGate[*].durations = [600us, 4400us]

[Config CrossDomainTransportExternal]
extends = CrossDomainTransport
*.controller.requireController = true

[Config CrossDomainRadio]
extends = CrossDomainTransport
*.controller.ranSchedulerModule = "gnb1.cellularNic.mac.schedulerDl"
*.gnb1.cellularNic.mac.dlSchedulerType = "nasctime.control.ControlledDlScheduler"
*.gnb1.cellularNic.mac.schedulingDisciplineDl = "MAXCI"
*.gnb1.cellularNic.mac.schedulerDl.controlledDlAllocatedBlocks.vector-recording = true

[Config CrossDomainRadioExternal]
extends = CrossDomainRadio
*.controller.requireController = true
