include omnetpp.ini
include routed-queues.ini

[Config E2eTraffic]
description = "Three UDP classes in both directions for each NR UE"
sim-time-limit = 2s
*.spanLength = 30km
# Only record vectors used for timing, sequence pairing, and gate checks.
**.app[*].packetSent:vector*.vector-recording = true
**.app[*].packetReceived:vector*.vector-recording = true
**.app[*].endToEndDelay:vector.vector-recording = true
**.app[*].rcvdPkSeqNo:vector.vector-recording = true
**.NE*.eth[*].queue.transmissionGate[*].gateState:vector.vector-recording = true
**.NE*.eth[*].queue.queue[*].queueingTime:vector.vector-recording = true
**.vector-recording = false


*.ue[*].numApps = 6
*.server.numApps = 12
*.server.app[0..5].startTime = 0s

# Record only Ethernet interfaces to inspect the outer GTP-U IP header.
*.NE{1,2,5,6}.recordPcap = true
*.NE{1,2,5,6}.pcapRecorder[*].moduleNamePatterns = "eth[*]"
*.NE*.fcsMode = "computed"
**.ip.checksumMode = "computed"
**.udp.checksumMode = "disabled"

*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].localPort = -1
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 6000
*.ue[0].app[0].messageLength = 200B
*.ue[0].app[0].sendInterval = 10ms
*.ue[0].app[0].startTime = 100ms
*.ue[0].app[0].stopTime = 1700ms
*.ue[0].app[0].dscp = 46
*.server.app[0].typename = "UdpSink"
