[Config E2ePriority]
extends = E2eLightTraffic, RoutedPriority

[Config E2eLightTraffic]
extends = E2eTraffic
description = "Sparse smoke traffic to validate class mapping before raising radio load"
*.ue[*].app[0..2].messageLength = 200B
*.ue[*].app[0..2].sendInterval = 100ms
*.ue[*].app[1].startTime = 130ms
*.ue[*].app[2].startTime = 160ms
*.server.app[6..11].messageLength = 200B
*.server.app[6..11].sendInterval = 100ms

[Config E2eTas]
extends = E2eLightTraffic, RoutedTas

[Config E2eZeroOuterDscp]
extends = E2ePriority
description = "Keep inner traffic classes while mapping both nonzero QFIs to outer DSCP zero"
**.gtpUser.qfiDscpMap = "46:0,34:0"
**.gtp_user.qfiDscpMap = "46:0,34:0"

[Config E2eMixedLoad]
extends = E2eTraffic, RoutedTas

[Config E2eMixedLoadPriority]
extends = E2eTraffic, RoutedPriority
