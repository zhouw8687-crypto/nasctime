include omnetpp.ini
include routed-queues.ini

[Config CompetitionTraffic]
description = "Two downlink flows share NE1 to NE3 and the gNB1 cell"
sim-time-limit = 3s
*.spanLength = 30km
*.NE{1,3}.eth[1].bitrate = 10Mbps

*.server.numApps = 2
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "ue[0]"
*.server.app[*].stopTime = 1600ms
*.server.app[0].destPort = 6200
*.server.app[0].localPort = 6201
*.server.app[0].packetName = "Control"
*.server.app[0].messageLength = 200B
*.server.app[0].startTime = 100ms
*.server.app[0].sendInterval = 5ms
*.server.app[0].dscp = 46
*.server.app[1].destPort = 6202
*.server.app[1].localPort = 6203
*.server.app[1].packetName = "Background"
*.server.app[1].messageLength = 1000B
*.server.app[1].startTime = 110ms
*.server.app[1].sendInterval = simTime() >= 600ms && simTime() < 1000ms ? 700us : 8ms
*.server.app[1].dscp = 0

*.ue[0].numApps = 2
*.ue[0].app[*].typename = "UdpSink"
*.ue[0].app[*].startTime = 0s
*.ue[0].app[0].localPort = 6200
*.ue[0].app[1].localPort = 6202
*.ue[1].numApps = 0

# Timestamps at each capture point use the simulator clock.
*.upf.numPcapRecorders = 2
*.upf.pcapRecorder[0].moduleNamePatterns = "dnPpp"
*.upf.pcapRecorder[1].moduleNamePatterns = "ppp[0]"
*.upf.pcapRecorder[*].dumpProtocols = "ipv4"
*.upf.pcapRecorder[0].pcapFile = "${resultdir}/upf-n6.pcap"
*.upf.pcapRecorder[1].pcapFile = "${resultdir}/upf-n3.pcap"
*.NE{1,5}.recordPcap = true
*.NE{1,5}.pcapRecorder[0].moduleNamePatterns = "eth[1]"
*.NE1.pcapRecorder[0].pcapFile = "${resultdir}/ne1-egress.pcap"
*.NE5.pcapRecorder[0].pcapFile = "${resultdir}/ne5-ingress.pcap"
*.NE5.numPcapRecorders = 2
*.NE5.pcapRecorder[1].moduleNamePatterns = "ppp[0]"
*.NE5.pcapRecorder[1].dumpProtocols = "ipv4"
*.NE5.pcapRecorder[1].pcapFile = "${resultdir}/ne5-to-gnb.pcap"
**.pcapRecorder[*].fileFormat = "pcap"
**.pcapRecorder[*].timePrecision = 9
*.NE*.fcsMode = "computed"
**.ip.checksumMode = "computed"
**.udp.checksumMode = "disabled"

**.app[*].packetSent:vector*.vector-recording = true
**.app[*].packetReceived:vector*.vector-recording = true
**.app[*].endToEndDelay:vector.vector-recording = true
**.app[*].rcvdPkSeqNo:vector.vector-recording = true
*.NE1.eth[1].queue.**.queueLength:vector.vector-recording = true
*.NE1.eth[1].queue.**.queueingTime:vector.vector-recording = true
*.NE1.eth[1].queue.transmissionGate[*].gateState:vector.vector-recording = true
**.vector-recording = false

[Config CompetitionFifo]
extends = CompetitionTraffic
*.NE1.eth[1].queue.packetCapacity = 384

[Config CompetitionPriority]
extends = CompetitionTraffic, RoutedPriority
*.NE{1,3}.eth[1].queue.bitrate = 10Mbps

[Config CompetitionTas]
extends = CompetitionPriority
*.NE1.eth[1].queue.hasGcl = true
*.NE1.eth[1].queue.gateControlList.numGates = 3
*.NE1.eth[1].queue.gateControlList.mapping = "012"
*.NE1.eth[1].queue.gateControlList.durations = [600us, 100us, 4300us]
*.NE1.eth[1].queue.gateControlList.gateStates = ["001", "010", "100"]

[Config CompetitionNoBurst]
extends = CompetitionFifo
description = "FIFO baseline with the same two flows and constant background"
*.server.app[1].sendInterval = 8ms
