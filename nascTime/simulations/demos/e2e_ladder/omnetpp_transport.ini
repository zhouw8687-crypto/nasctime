[General]
network = nasctime.simulations.demos.e2e_ladder.TransportLadder
sim-time-limit = 2s
*.spanLength = 30km
*.NE*.eth[*].bitrate = 100Mbps

# Only record vectors used for timing, sequence pairing, and gate checks.
**.app[*].packetSent:vector*.vector-recording = true
**.app[*].packetReceived:vector*.vector-recording = true
**.app[*].endToEndDelay:vector.vector-recording = true
**.app[*].rcvdPkSeqNo:vector.vector-recording = true
**.NE*.eth[*].queue.transmissionGate[*].gateState:vector.vector-recording = true
**.NE*.eth[*].queue.queue[*].queueingTime:vector.vector-recording = true
**.vector-recording = false

# Both accesses send independently to the corresponding dual-homed address.
# Each sets up a three-class contention point on its own first Ethernet hop.
*.access*.numApps = 3
*.access*.app[*].typename = "UdpBasicApp"
*.access1.app[*].destAddresses = "core%ppp0"
*.access2.app[*].destAddresses = "core%ppp1"
*.access*.app[*].startTime = 100ms
*.access*.app[*].stopTime = 1700ms
*.access*.app[*].dontFragment = true
# Frame length excludes preamble and interframe gap. UDP/IPv4/MAC/FCS = 46 B.
# The nominal offered load includes a further 20 B of Ethernet line overhead.
*.access*.app[0].messageLength = 978B
*.access*.app[1].messageLength = 1472B
*.access*.app[2].messageLength = 466B
*.access*.app[0].sendInterval = 417.6us
*.access*.app[1].sendInterval = 246.08us
*.access*.app[2].sendInterval = 425.6us
*.access*.app[0].dscp = 46
*.access*.app[1].dscp = 34
*.access*.app[2].dscp = 0
*.access1.app[0].destPort = 6000
*.access1.app[1].destPort = 6001
*.access1.app[2].destPort = 6002
*.access2.app[0].destPort = 6003
*.access2.app[1].destPort = 6004
*.access2.app[2].destPort = 6005
*.core.numApps = 6
*.core.app[*].typename = "UdpSink"
*.core.app[0].localPort = 6000
*.core.app[1].localPort = 6001
*.core.app[2].localPort = 6002
*.core.app[3].localPort = 6003
*.core.app[4].localPort = 6004
*.core.app[5].localPort = 6005

[Config T1Single]
extends = RoutedPriority
description = "One flow per path with open gates and no competing classes"
*.access*.numApps = 1

[Config T2Fifo]
description = "One FIFO queue per routed Ethernet interface"
*.NE*.eth[*].queue.packetCapacity = 384

[Config T2Priority]
extends = RoutedPriority

[Config T2Tas]
extends = RoutedTas

[Config T2TasPhase]
extends = T2Tas
description = "Shift the entire offered traffic pattern by 500 us"
*.access*.app[*].startTime = 100.5ms
*.access*.app[*].stopTime = 1700.5ms

[Config T3Burst]
extends = T2Tas
description = "High priority offered load goes from 20% to 40% and back"
*.access*.app[0].sendInterval = simTime() >= 600ms && simTime() < 1100ms ? 208.8us : 417.6us

[Config T3OverloadTraffic]
description = "Low priority goes from 10% to 100% and back"
*.access*.app[2].sendInterval = simTime() >= 600ms && simTime() < 1100ms ? 42.56us : 425.6us

[Config T3OverloadFifo]
extends = T3OverloadTraffic, T2Fifo

[Config T3OverloadPriority]
extends = T3OverloadTraffic, T2Priority

[Config T3OverloadTas]
extends = T3OverloadTraffic, T2Tas

[Config T4Soak]
extends = T2Tas
description = "Thirty-second stability check with a drain interval"
sim-time-limit = 30s
*.access*.app[*].stopTime = 29.7s

[Config T2TasStaggered]
extends = T2Tas
description = "The second uplink hop starts its schedule 200 us later"
*.NE{3,4}.eth[1].queue.gateControlList.durations = [200us, 500us, 1200us, 100us]
*.NE{3,4}.eth[1].queue.gateControlList.gateStates = ["100", "001", "010", "100"]

[Config T3ExpansionFixed]
extends = T2Priority
description = "Left AF41 demand rises from 50% to 60% under a fixed schedule"
*.access1.app[1].sendInterval = simTime() >= 600ms && simTime() < 1100ms ? 205.133333us : 246.08us
*.access*.app[2].sendInterval = 851.2us
# These PeriodicGate settings express the same initial schedule as T2Tas.
# Runtime reconfiguration applies directly to PeriodicGate's mutable parameters.
*.NE*.eth[*].queue.transmissionGate[2].durations = [500us, 1500us]
*.NE*.eth[*].queue.transmissionGate[1].durations = [1200us, 800us]
*.NE*.eth[*].queue.transmissionGate[1].offset = 1500us
*.NE*.eth[*].queue.transmissionGate[0].initiallyOpen = false
*.NE*.eth[*].queue.transmissionGate[0].durations = [1700us, 300us]

[Config T3Expansion]
extends = T3ExpansionFixed
description = "Scripted AF41 window expansion on both left uplink hops"
*.scenarioManager.script = xmldoc("expand-af41.xml")

[Config T3LinkErrors]
extends = T2Tas
description = "Reversible packet-error impairment on the left upper span"
*.scenarioManager.script = xmldoc("link-errors.xml")

include routed-queues.ini

[Config T0CrossLinks]
description = "Check all three ladder rungs with one-hop ICMP probes"
sim-time-limit = 1s
*.access*.numApps = 0
*.core.numApps = 0
*.NE{1,3,5}.numApps = 1
*.NE{1,3,5}.app[0].typename = "PingApp"
*.NE{1,3,5}.app[0].hopLimit = 1
*.NE{1,3,5}.app[0].count = 5
*.NE{1,3,5}.app[0].startTime = 100ms
*.NE{1,3,5}.app[0].sendInterval = 50ms
*.NE1.app[0].destAddr = "NE2%eth0"
*.NE3.app[0].destAddr = "NE4%eth0"
*.NE5.app[0].destAddr = "NE6%eth0"

[Config PhaseLockedTraffic]
description = "One high-priority frame per 2 ms gate cycle"
*.access*.app[0].sendInterval = 2ms

[Config T2PhaseLockedPriority]
extends = PhaseLockedTraffic, T2Priority

[Config T2PhaseLockedTas]
extends = PhaseLockedTraffic, T2Tas
