include omnetpp_competition.ini

[Config ControllerBaseline]
extends = CompetitionPriority
network = nasctime.simulations.demos.e2e_ladder.ControlledCompetition
*.controller.traceFile = "${resultdir}/control.jsonl"
description = "Shared competition with a nonbinding UPF ingress policer"
*.upf.dnPpp.ingressTC.typename = "nasctime.control.FlowPolicer"
*.upf.dnPpp.ingressTC.flowId = "background"
*.upf.dnPpp.ingressTC.packetFilter = expr(has(ipv4) && has(udp) && udp.destPort == 6202)
*.upf.dnPpp.ingressTC.initialRate = 20Mbps

[Config ControllerStaticCap]
extends = ControllerBaseline
description = "UPF background policing at a fixed 4 Mbps"
*.upf.dnPpp.ingressTC.initialRate = 4Mbps

[Config ControllerExternal]
extends = ControllerBaseline
description = "External controller receives actual state and can change UPF background rate"
*.controller.requireController = true
