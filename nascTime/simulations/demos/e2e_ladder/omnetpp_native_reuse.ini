include omnetpp_qos.ini

[Config ReuseSdap]
extends = E2ePriority
description = "Native Simu5G SDAP with three downlink DRBs and the default uplink DRB"
*.gnb*.cellularNic.hasSdap = true
*.ue[*].cellularNic.hasSdap = true
# Binder assigns these IDs to the two NR UEs in ProjectBookLadder.
*.gnb1.cellularNic.sdap.drbConfig = [ \
    {drb: 0, ue: 2049, qfiList: [0], isDefault: true}, \
    {drb: 1, ue: 2049, qfiList: [46]}, \
    {drb: 2, ue: 2049, qfiList: [34]}]
*.gnb2.cellularNic.sdap.drbConfig = [ \
    {drb: 0, ue: 2050, qfiList: [0], isDefault: true}, \
    {drb: 1, ue: 2050, qfiList: [46]}, \
    {drb: 2, ue: 2050, qfiList: [34]}]
*.ue[*].cellularNic.sdap.drbConfig = [ \
    {drb: 0, qfiList: [0], isDefault: true}, \
    {drb: 1, qfiList: [46]}, \
    {drb: 2, qfiList: [34]}]
*.NE*.recordPcap = true
*.NE*.pcapRecorder[*].moduleNamePatterns = "eth[*]"

[Config ReuseDirect]
extends = ReuseSdap
description = "Pin the N3 downlink for gNB1 over NE1-NE3-NE5"
*.configurator.config = xmldoc("native-reuse.xml", "/reuse/config[@id='direct']")

[Config ReuseDetour]
extends = ReuseSdap
description = "Pin the same N3 downlink over NE1-NE2-NE4-NE6-NE5"
*.configurator.config = xmldoc("native-reuse.xml", "/reuse/config[@id='detour']")

[Config ReuseQosPf]
extends = ReuseDirect
description = "Use the native QoS-aware downlink scheduler with DRB attributes"
*.gnb*.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb1.cellularNic.mac.drbQosConfig = [ \
    {drb: 0, ue: 2049, gbr: false, delayBudget: 50, per: 1e-2, priority: 5}, \
    {drb: 1, ue: 2049, gbr: true, delayBudget: 5, per: 1e-4, priority: 1}, \
    {drb: 2, ue: 2049, gbr: false, delayBudget: 20, per: 1e-3, priority: 3}]
*.gnb2.cellularNic.mac.drbQosConfig = [ \
    {drb: 0, ue: 2050, gbr: false, delayBudget: 50, per: 1e-2, priority: 5}, \
    {drb: 1, ue: 2050, gbr: true, delayBudget: 5, per: 1e-4, priority: 1}, \
    {drb: 2, ue: 2050, gbr: false, delayBudget: 20, per: 1e-3, priority: 3}]

[Config ReuseLinkFailover]
extends = ReuseSdap
description = "Use INET route recalculation after disconnecting NE3-NE5"
network = nasctime.simulations.demos.e2e_ladder.ReuseFailoverLadder
*.configurator.config = xmldoc("native-reuse.xml", "/reuse/config[@id='fixed-addresses']")
*.configurator.updateRoutes = true
# After disconnection the two isolated ports can keep their original subnet.
*.configurator.assignDisjunctSubnetAddresses = false
*.scenarioManager.script = xmldoc("native-reuse.xml", "/reuse/scenario")
