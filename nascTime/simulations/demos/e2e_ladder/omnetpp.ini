#
# e2e_ladder —— “日”字形承载网 + 双归接入的端到端场景
#
# 与 e2e_test（链式）对照，验证：
#   1) 日字形二层环网在 RSTP 下能否正常工作（无广播风暴）；
#   2) 双归接入（核心网/基站各两条上行）在 RSTP 下的实际路径选择；
#   3) 三类接入（无线下行/无线上行/有线）的端到端指标与链式拓扑的差异。
#
# 注意：RSTP 需要收敛时间，业务从 2 s 开始；仿真总长 6 s。
#
[General]
network = nasctime.simulations.demos.e2e_ladder.ProjectBookLadder
sim-time-limit = 6s

*.*.eth[*].bitrate = 100Mbps

############### 无线接入 ###############
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 200m
*.ue[0].mobility.initialY = 200m
*.gnb.mobility.initialX = 150m
*.gnb.mobility.initialY = 150m

# 上行：UE → server
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 6000
*.ue[0].app[0].localPort = 6001
*.ue[0].app[0].messageLength = 200B
*.ue[0].app[0].sendInterval = 10ms
*.ue[0].app[0].startTime = 2s

# 下行：server → UE
*.ue[0].app[1].typename = "UdpSink"
*.ue[0].app[1].localPort = 6200

############### 有线接入 ###############
*.host.numApps = 1
*.host.app[0].typename = "UdpBasicApp"
*.host.app[0].destAddresses = "server"
*.host.app[0].destPort = 6100
*.host.app[0].localPort = 6101
*.host.app[0].messageLength = 200B
*.host.app[0].sendInterval = 10ms
*.host.app[0].startTime = 2s

############### 数据网 ###############
*.server.numApps = 3
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 6000
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 6100
*.server.app[2].typename = "UdpBasicApp"
*.server.app[2].destAddresses = "ue[0]"
*.server.app[2].destPort = 6200
*.server.app[2].localPort = 6201
*.server.app[2].messageLength = 200B
*.server.app[2].sendInterval = 10ms
*.server.app[2].startTime = 2s

############### 承载：三层日字形 ###############
# 六台 NE 为三层路由节点，环路由路由处理，无需 STP，也不会出现广播风暴。
# Qbv 门控不在本场景启用（能力验证见 pe_test）。
