# Two NR gNBs reach the dual-homed 5GC over the routed ladder.
# gNBs use N3 via NE5/NE6; the data server is on the UPF N6 interface.

[General]
network = nasctime.simulations.demos.e2e_ladder.ProjectBookLadder
sim-time-limit = 6s

*.*.eth[*].bitrate = 100Mbps

############### 两台基站与两个终端 ###############
*.gnb1.mobility.initialX = 100m
*.gnb1.mobility.initialY = 100m
*.gnb2.mobility.initialX = 500m
*.gnb2.mobility.initialY = 100m

*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 120m
*.ue[0].mobility.initialY = 150m

*.ue[1].servingNodeId = 0
*.ue[1].nrServingNodeId = 2
*.ue[1].mobility.initialX = 520m
*.ue[1].mobility.initialY = 150m

############### 上行：ue[i] → server ###############
*.ue[0].numApps = 2
*.ue[0].app[0].typename = "UdpBasicApp"
*.ue[0].app[0].destAddresses = "server"
*.ue[0].app[0].destPort = 6000
*.ue[0].app[0].localPort = 6001
*.ue[0].app[0].messageLength = 200B
*.ue[0].app[0].sendInterval = 10ms
*.ue[0].app[0].startTime = 2s
*.ue[0].app[1].typename = "UdpSink"
*.ue[0].app[1].localPort = 6200

*.ue[1].numApps = 2
*.ue[1].app[0].typename = "UdpBasicApp"
*.ue[1].app[0].destAddresses = "server"
*.ue[1].app[0].destPort = 6002
*.ue[1].app[0].localPort = 6003
*.ue[1].app[0].messageLength = 200B
*.ue[1].app[0].sendInterval = 10ms
*.ue[1].app[0].startTime = 2s
*.ue[1].app[1].typename = "UdpSink"
*.ue[1].app[1].localPort = 6202

############### 下行：server → ue[i] ###############
*.server.numApps = 4
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 6000
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 6002

*.server.app[2].typename = "UdpBasicApp"
*.server.app[2].destAddresses = "ue[0]"
*.server.app[2].destPort = 6200
*.server.app[2].localPort = 6201
*.server.app[2].messageLength = 200B
*.server.app[2].sendInterval = 10ms
*.server.app[2].startTime = 2s

*.server.app[3].typename = "UdpBasicApp"
*.server.app[3].destAddresses = "ue[1]"
*.server.app[3].destPort = 6202
*.server.app[3].localPort = 6203
*.server.app[3].messageLength = 200B
*.server.app[3].sendInterval = 10ms
*.server.app[3].startTime = 2s
