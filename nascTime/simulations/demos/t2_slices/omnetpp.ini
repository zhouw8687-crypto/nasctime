#
# t2_slices —— 测试方案用例 T2：三流三切片
#
# 三条流（占 100 Mbps 链路的比例，按方案表10）：
#   流1 切片1 高优先控制流  20%  1024 B
#   流2 切片2 中优先大带宽  50%  1500 B
#   流3 切片3 低优先背景流  10%   512 B
#   合计 80%
#
# 两个配置：
#   NoGating —— 仅静态优先级调度（对照）
#   TAS      —— 三相门控（等级2:200µs / 等级1:600µs / 等级0:200µs）
#
[General]
network = nasctime.simulations.demos.t2_slices.T2SlicesNetwork
sim-time-limit = 2s

*.*.eth[*].bitrate = 100Mbps

# 用 GlobalArp 替代广播式 ARP：不产生 ARP 报文，避免流分类表达式遇到无 UDP 头的包
**.arp.typename = "GlobalArp"

# ---------------- 三条业务流 ----------------
# 流1：1024 B 载荷，20% → 1042 B 帧，间隔 417 µs
*.client1.numApps = 1
*.client1.app[0].typename = "UdpBasicApp"
*.client1.app[0].destAddresses = "server"
*.client1.app[0].destPort = 1001
*.client1.app[0].localPort = 2001
*.client1.app[0].messageLength = 1024B
*.client1.app[0].sendInterval = 463us   # 18% 负载，窗口 25%，留 7% 余量
*.client1.app[0].startTime = 0.05s

# 流2：1500 B 载荷（1518 B 帧），50% → 间隔 243 µs
*.client2.numApps = 1
*.client2.app[0].typename = "UdpBasicApp"
*.client2.app[0].destAddresses = "server"
*.client2.app[0].destPort = 1002
*.client2.app[0].localPort = 2002
*.client2.app[0].messageLength = 1472B   # 避免 IP 分片：1472+20+8=1500 MTU
*.client2.app[0].sendInterval = 270us   # 45% 负载，窗口 65%
*.client2.app[0].startTime = 0.05s

# 流3：512 B 载荷（530 B 帧），10% → 间隔 424 µs
*.client3.numApps = 1
*.client3.app[0].typename = "UdpBasicApp"
*.client3.app[0].destAddresses = "server"
*.client3.app[0].destPort = 1003
*.client3.app[0].localPort = 2003
*.client3.app[0].messageLength = 512B
*.client3.app[0].sendInterval = 530us   # 8% 负载，窗口 10%
*.client3.app[0].startTime = 0.05s

# ---------------- 接收端 ----------------
*.server.numApps = 3
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 1001
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 1002
*.server.app[2].typename = "UdpSink"
*.server.app[2].localPort = 1003

# ---------------- DSCP 标记（切片标识）----------------
# 切片1 → DSCP 46（EF），切片2 → DSCP 34（AF41），切片3 → DSCP 0（BE）
*.client1.app[0].dscp = 46
*.client2.app[0].dscp = 34
*.client3.app[0].dscp = 0

# 承载设备剥掉 C-Tag，避免接收端不认识带标签的帧
*.pe*.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.pe*.eth[*].macLayer.queue.numTrafficClasses = 3


#
# 对照：仅静态优先级调度，不开门控
#
[Config NoGating]
description = "三流按静态优先级竞争，无时间门控"


#
# TAS：三相门控（周期 1 ms）
#
[Config TAS]
description = "等级2 独占 0-200µs，等级1 独占 200-800µs，等级0 独占 800-1000µs"

*.pe*.hasEgressTrafficShaping = true

# 按 DSCP 分类（替代默认的 PCP 分类器）
*.pe*.eth[*].macLayer.queue.classifier.filters = xml("<filters><filter dscp=\"46\" gate=\"2\"/><filter dscp=\"34\" gate=\"1\"/></filters>")

# 三相门控用 PeriodicGate 直接配置（GateControlList 在本场景未生效，见 README）
# 周期 1 ms：等级2 独占 0-250 µs；等级1 独占 250-1000 µs；等级0 用剩余窗口
*.pe*.eth[*].macLayer.queue.transmissionGate[2].initiallyOpen = true
*.pe*.eth[*].macLayer.queue.transmissionGate[2].durations = [250us, 750us]
*.pe*.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.pe*.eth[*].macLayer.queue.transmissionGate[1].durations = [250us, 750us]
*.pe*.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.pe*.eth[*].macLayer.queue.transmissionGate[0].durations = [900us, 100us]
