#
# ring_test + 承载域探针
#
# 在 omnetpp.ini（三角环双路径）基础上，加三组 FlowMeasurement 探针：
#   e2e   : source.eth[0] 出口 → destination.eth[0] 入口  = 承载段端到端时延
#   pathA : pe1.eth[1]  出口 → pe3.eth[0] 入口           = 直连路径时延
#   pathB : pe1.eth[2]  出口 → pe3.eth[1] 入口           = 经 pe2 两跳路径时延
#
# 端口对应关系（由 RingMultipathShowcase.ned 的连接顺序决定）：
#   pe1.eth[0] ↔ source      pe1.eth[1] ↔ pe3      pe1.eth[2] ↔ pe2
#   pe2.eth[0] ↔ pe1         pe2.eth[1] ↔ pe3
#   pe3.eth[0] ↔ pe1         pe3.eth[1] ↔ pe2      pe3.eth[2] ↔ destination
#
[General]
network = nasctime.simulations.demos.ring_test.RingMultipathShowcase
sim-time-limit = 50ms

*.macForwardingTableConfigurator.typename = ""
*.*.eth[*].bitrate = 100Mbps
*.*.hasStreamRedundancy = true
*.*.hasTimeSynchronization = false

*.source.numApps = 1
*.source.app[0].typename = "UdpSourceApp"
*.source.app[0].io.destAddress = "destination"
*.source.app[0].io.destPort = 1000
*.source.app[0].source.packetLength = 1200B
*.source.app[0].source.productionInterval = 1ms

*.destination.numApps = 1
*.destination.app[0].typename = "UdpSinkApp"
*.destination.app[0].io.localPort = 1000
*.destination.eth[*].address = "0A-AA-12-34-56-78"

*.streamRedundancyConfigurator.typename = "StreamRedundancyConfigurator"
*.streamRedundancyConfigurator.configuration = [{
        name: "S1",
        packetFilter: "*",
        source: "source",
        destination: "destination",
        trees: [
            [["source", "pe1", "pe3", "destination"]],
            [["source", "pe1", "pe2", "pe3", "destination"]]
        ]
    }]

# ==================== 探针 1：端到端（承载段）====================
*.source.eth[0].measurementLayer.typename = "MeasurementLayer"
*.source.eth[0].measurementLayer.measurementStarter.flowName = "e2e"
*.source.eth[0].measurementLayer.measurementStarter.measure = "elapsedTime"
*.destination.eth[0].measurementLayer.typename = "MeasurementLayer"
*.destination.eth[0].measurementLayer.measurementRecorder.flowName = "e2e"
*.destination.eth[0].measurementLayer.measurementRecorder.measure = "elapsedTime"

# ==================== 探针 2：路径 A（直连 pe1→pe3）====================
*.pe1.eth[1].measurementLayer.typename = "MeasurementLayer"
*.pe1.eth[1].measurementLayer.measurementStarter.flowName = "pathA"
*.pe1.eth[1].measurementLayer.measurementStarter.measure = "elapsedTime"
*.pe3.eth[0].measurementLayer.typename = "MeasurementLayer"
*.pe3.eth[0].measurementLayer.measurementRecorder.flowName = "pathA"
*.pe3.eth[0].measurementLayer.measurementRecorder.measure = "elapsedTime"

# ==================== 探针 3：路径 B（两跳 pe1→pe2→pe3）====================
*.pe1.eth[2].measurementLayer.typename = "MeasurementLayer"
*.pe1.eth[2].measurementLayer.measurementStarter.flowName = "pathB"
*.pe1.eth[2].measurementLayer.measurementStarter.measure = "elapsedTime"
*.pe3.eth[1].measurementLayer.typename = "MeasurementLayer"
*.pe3.eth[1].measurementLayer.measurementRecorder.flowName = "pathB"
*.pe3.eth[1].measurementLayer.measurementRecorder.measure = "elapsedTime"
