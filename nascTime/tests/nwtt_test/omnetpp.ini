#
# NW-TT Test Scenario
#
# Validates Ethernet frame encapsulation/decapsulation at the NW-TT and
# end-to-end delivery through the 5GS.
#
# Based on simulations/NR/standalone/omnetpp.ini structure.
#

[General]
network = nasctime.tests.nwtt_test.NwTtTestNetwork
sim-time-limit = 10s
warmup-period = 1s

# --- Scheduler ---
scheduler-class = "omnetpp::cSequentialScheduler"

# --- Results ---
output-vector-file = ${resultdir}/${configname}-${iterationvarsf}#${repetition}.vec
output-scalar-file = ${resultdir}/${configname}-${iterationvarsf}#${repetition}.sca
result-dir = results/nwtt_test
**.routingRecorder.enabled = false

# Disable all vector recording to avoid type conversion errors
**.vector-recording = false
**.scalar-recording = true

# Disable the problematic signals entirely
**.receivedPacketFromLowerLayer.result-recording-modes = -
**.receivedPacketFromUpperLayer.result-recording-modes = -
**.packetReceived.result-recording-modes = -
**.packetSent.result-recording-modes = -
**.sentPacketToLowerLayer.result-recording-modes = -
**.sentPacketToUpperLayer.result-recording-modes = -

# --- IPv4 configurator behavior ---
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"

# --- Common Simu5G globals ---
**.binderModule = "binder"
# ============================================================================
# 5G RAN — single carrier, no fading (deterministic for validation)
# ============================================================================
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

# gNB
*.gnb.cellularNic.typename = "NrNicEnb"
# FIX: channelModel[0] is a direct submodule of cellularNic, not nested
# under phy — "phy.channelModel[0]..." silently no-op'd (casing was already
# correct here, just the path).
*.gnb.cellularNic.channelModel[0].typename = "NrChannelModel"
*.gnb.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.channelModel[0].shadowing = false
*.gnb.cellularNic.channelModel[0].fading = false
*.gnb.cellularNic.channelModel[0].dynamicLos = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m

# UE
*.ue[0].cellularNic.typename = "NrNicUe"
*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 250m

# FIX: masterId/nrMacCellId/nrMasterId are stale (same rename as your other
# ini files). CHECK before assuming "needed for SDAP" applies here: this
# scenario's traffic never touches sdap.drbConfig at all (TSN Device -> UE
# direct, no second UE/DS-TT). If NwTtTestNetwork's purpose is specifically
# to validate NW-TT Ethernet encap/decap in isolation, hasSdap=true may be
# intentionally absent -- confirm that's the intent before adding it, unlike
# the other three inis where SDAP was clearly in scope.
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
# ============================================================================
# NW-TT configuration
# ============================================================================
# CHECK (now 3-of-4 of your inis agree on this no-prefix form; only the
# multi-endpoint one uses nwTt.translator.ueAddress/localAddress -- worth
# resolving against NwTtTranslator.ned once and fixing the outlier).
*.nwTt.ueAddress = "ue[0]"
*.nwTt.localAddress = "nwTt"
*.nwTt.translator.encapUdpPort = 30000
*.nwTt.translator.tsnPortMacAddress = "0A:00:00:00:00:01"
*.nwTt.translator.defaultDstMacAddress = "0A:00:00:00:00:10"

# ============================================================================
# Ethernet interface configuration
# ============================================================================
# Bitrates (required by LayeredEthernetInterface, no default)
*.tsnDevice.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps

*.tsnDevice.eth[*].typename = "LayeredEthernetInterface"
*.tsnDevice.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitch.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitch.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
# ============================================================================
# TSN Device — CBR traffic source
# ============================================================================
*.tsnDevice.numApps = 1
*.tsnDevice.app[0].typename = "UdpBasicApp"
*.tsnDevice.app[0].destAddresses = "ue[0]"
*.tsnDevice.app[0].destPort = 5000
*.tsnDevice.app[0].localPort = 5000
*.tsnDevice.app[0].messageLength = 100B
*.tsnDevice.app[0].sendInterval = 1ms
*.tsnDevice.app[0].startTime = uniform(0s, 0.01s)

# ============================================================================
# UE — traffic sink
# ============================================================================
*.ue[0].numApps = 1
*.ue[0].app[0].typename = "UdpSink"
*.ue[0].app[0].localPort = 5000

# ============================================================================
# Statistics
# ============================================================================
# NW-TT translator signals
*.nwTt.translator.encapDelay.result-recording-modes = default,vector
*.nwTt.translator.decapDelay.result-recording-modes = default,vector
*.nwTt.translator.ethFrameReceived.result-recording-modes = default
*.nwTt.translator.ipPacketReceived.result-recording-modes = default
*.nwTt.translator.packetDropped.result-recording-modes = default

# UE app (end-to-end confirmation)
*.ue[0].app[0].**.result-recording-modes = default,vector

# MAC delay at gNB
*.gnb.cellularNic.mac.**.result-recording-modes = default,vector

# ============================================================================
# Scenario configs
# ============================================================================

[Config NwTtBasicTest]
description = "Basic NW-TT test — 1ms CBR, no fading, single UE"
# defaults from [General]

[Config NwTtHighLoad]
description = "Higher load — 0.5ms interval, 500B packets"
*.tsnDevice.app[0].sendInterval = 0.5ms
*.tsnDevice.app[0].messageLength = 500B

[Config NwTtFading]
description = "With Rayleigh fading — test NW-TT under variable radio"
*.gnb.cellularNic.channelModel[0].fading = true
*.gnb.cellularNic.channelModel[0].fadingType = "RAYLEIGH"