#
# Full 5G-TSN Bridge Test
#
# TSN Device A → TsnSwitch → NW-TT → UPF → gNB ~~NR~~ UE → DS-TT → TSN Device B
#
# The nwtt_test simulation is preserved unchanged as the NW-TT-only baseline.
#

[General]
network = nasctime.tests.bridge_test.BridgeTestNetwork
sim-time-limit = 10s
warmup-period = 1s

scheduler-class = "omnetpp::cSequentialScheduler"

result-dir = results/bridge_test
**.routingRecorder.enabled = false

# Suppress statistics type errors
**.vector-recording = false
**.scalar-recording = true
**.receivedPacketFromLowerLayer.result-recording-modes = -
**.packetReceived.result-recording-modes = -

# ============================================================================
# IP / ARP
# ============================================================================
*.configurator.addDefaultRoutes = false
**.arp.typename = "GlobalArp"
**.binderModule = "binder"

# ============================================================================
# 5G RAN
# ============================================================================
*.carrierAggregation.componentCarrier[0].carrierFrequency = 3.5GHz
*.carrierAggregation.componentCarrier[0].numBands = 25
*.carrierAggregation.componentCarrier[0].numerologyIndex = 1

*.gnb.cellularNic.typename = "NrNicEnb"

# FIX: channelModel[0] is a direct submodule of cellularNic, NOT nested under
# phy (confirmed: LteNicBase.ned instantiates channelModel[numCarriers] as a
# sibling of phy). "phy.channelModel[0]..." was silently no-op'd — same bug
# as in the extended multi-endpoint ini.
# FIX: typename was "NRChannelModel" (wrong casing) — real NED type is
# "NrChannelModel" (confirmed via source, case-sensitive).
*.gnb.cellularNic.channelModel[0].typename = "NrChannelModel"
*.gnb.cellularNic.channelModel[0].scenario = "INDOOR_HOTSPOT"
*.gnb.cellularNic.channelModel[0].shadowing = false
*.gnb.cellularNic.channelModel[0].fading = false
*.gnb.cellularNic.channelModel[0].dynamicLos = false
*.gnb.mobility.initialX = 500m
*.gnb.mobility.initialY = 250m

*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 250m

# FIX: masterId/nrMacCellId/nrMasterId are stale (v1.4.3 renamed
# masterId->servingNodeId, nrMasterId->nrServingNodeId; nrMacCellId was
# removed outright, no replacement). Also: none of these are SDAP
# parameters — the "needed for SDAP" comment was misattributed. The actual
# SDAP-enabling flag (hasSdap) was missing entirely; added below.
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

*.gnb.cellularNic.hasSdap = true
*.ue[0].cellularNic.hasSdap = true

# ============================================================================
# UE (NRUeDsTt — has built-in Ethernet port for DS-TT)
# ============================================================================
*.ue[0].ipv4.forwarding = true

# ============================================================================
# NW-TT
# ============================================================================
# CHECK: this file uses nwTt.ueAddress / nwTt.localAddress (no "translator."
# prefix); the multi-endpoint ini uses nwTt.translator.ueAddress /
# nwTt.translator.localAddress. These can't both be right against the same
# NwTt.ned — verify against the current NwTtTranslator.ned parameter names
# before running, not after. Same question for encapUdpPort here vs.
# gptpEncapUdpPort in the multi-endpoint ini — confirm whether these are
# genuinely two different parameters or drift between the two files.
*.nwTt.ueAddress = "ue[0]"
*.nwTt.localAddress = "nwTt"
*.nwTt.translator.encapUdpPort = 30000
*.nwTt.translator.tsnPortMacAddress = "0A:00:00:00:00:01"
*.nwTt.translator.defaultDstMacAddress = "0A:00:00:00:00:10"
*.nwTt.translator.tsnDeviceBAddress = "tsnDeviceB"

# ============================================================================
# SDAP / DRB Configuration
# ============================================================================
*.gnb.cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "ue": 2049, "qfiList": [0], "rlcType": "UM"}]

*.ue[*].cellularNic.sdap.drbConfig = [ \
    {"drb": 0, "qfiList": [0], "rlcType": "UM"}]

# ============================================================================
# Ethernet bitrates
# ============================================================================
*.tsnDeviceA.eth[*].bitrate = 1Gbps
*.tsnSwitch.eth[*].bitrate = 1Gbps
*.tsnDeviceB.eth[*].bitrate = 1Gbps

*.tsnDeviceA.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceA.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnSwitch.eth[*].typename = "LayeredEthernetInterface"
*.tsnSwitch.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"
*.tsnDeviceB.eth[*].typename = "LayeredEthernetInterface"
*.tsnDeviceB.eth[*].phyLayer.typename = "EthernetStreamingPhyLayer"

# ============================================================================
# Traffic: TSN Device A → TSN Device B (through the full 5G-TSN bridge)
# ============================================================================
*.tsnDeviceA.numApps = 1
*.tsnDeviceA.app[0].typename = "UdpBasicApp"
*.tsnDeviceA.app[0].destAddresses = "tsnDeviceB"
*.tsnDeviceA.app[0].destPort = 5000
*.tsnDeviceA.app[0].localPort = 5000
*.tsnDeviceA.app[0].messageLength = 100B
*.tsnDeviceA.app[0].sendInterval = 1ms
*.tsnDeviceA.app[0].startTime = uniform(0s, 0.01s)
*.tsnDeviceA.app[0].dscp = 7

*.tsnDeviceB.numApps = 1
*.tsnDeviceB.app[0].typename = "UdpSink"
*.tsnDeviceB.app[0].localPort = 5000

# ============================================================================
# Scenario configs
# ============================================================================

[Config FullBridgeTest]
description = "Full 5G-TSN bridge — no fading, deterministic"

[Config FullBridgeWithFading]
description = "Full bridge with Rayleigh fading"
*.gnb.cellularNic.channelModel[0].fading = true
*.gnb.cellularNic.channelModel[0].fadingType = "RAYLEIGH"